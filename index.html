<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric/Imperial Unit Conversion</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div id="container">

        <!-- Header Section -->
        <header id="header">

            <h1 id="title">Metric/Imperial Unit Conversion</h1>

            <input type="number" id="number-input" value="20" step="any">

            <button id="convert-btn">Convert</button>

        </header>


        <!-- Conversion Results -->
        <main id="results">

            <!-- Length Conversion -->
            <section id="length-card">

                <h2 id="length-heading">Length (Meter/Feet)</h2>

                <p id="length-result">
                    20 meters = 65.620 feet | 20 feet = 6.096 meters
                </p>

            </section>


            <!-- Volume Conversion -->
            <section id="volume-card">

                <h2 id="volume-heading">Volume (Liters/Gallons)</h2>

                <p id="volume-result">
                    20 liters = 5.280 gallons | 20 gallons = 75.758 liters
                </p>

            </section>


            <!-- Mass Conversion -->
            <section id="mass-card">

                <h2 id="mass-heading">Mass (Kilograms/Pounds)</h2>

                <p id="mass-result">
                    20 kilos = 44.080 pounds | 20 pounds = 9.074 kilos
                </p>

            </section>

        </main>

    </div>

    <script src="index.js"></script>

</body>
</html>
